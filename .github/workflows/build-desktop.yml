name: Build Desktop

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # Beta/application-package tags are used for GitHub prereleases and should
    # not try to produce signed desktop updater artifacts. Run the desktop
    # matrix for stable v* tags or manual dispatch after signing secrets are
    # confirmed valid.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: ينتج tauri-action تلقائيًا مثبّت MSI (WiX) و EXE (NSIS)
          - platform: windows-latest
            args: ''
            rust-targets: ''
          # macOS: نبني ثنائيًا شاملًا (Intel + Apple Silicon)
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Linux: ينتج AppImage و deb و rpm
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            pkg-config

      - name: Install npm dependencies
        run: npm install

      - name: Validate updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e "const key = process.env.TAURI_SIGNING_PRIVATE_KEY || ''; if (!key.trim()) { throw new Error('TAURI_SIGNING_PRIVATE_KEY is required for signed desktop updater artifacts.'); } const first = key.charCodeAt(0); if (first === 0xFEFF || first === 239) { throw new Error('TAURI_SIGNING_PRIVATE_KEY starts with a BOM/hidden character. Re-copy the Tauri private key secret as plain text.'); }"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Muharrir ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## 🖥️ Muharrir — إصدار سطح المكتب

            ### ملفات التحميل حسب النظام
            - **Windows**: مثبّت `.msi` أو `.exe` (NSIS)
            - **macOS**: ملف `.dmg` (ثنائي شامل: Intel + Apple Silicon)
            - **Linux**: ملف `.AppImage` أو `.deb` أو `.rpm`

            ### خطوات أول تشغيل
            1. حمّل الملف المناسب لنظامك وثبّته.
            2. افتح التطبيق ثم اذهب إلى **الإعدادات (⚙️)**.
            3. أدخل **مفتاح API** و**Base URL** للمزوّد، ثم احفظ.
            4. تُحفظ المفاتيح بأمان في مخزن النظام (Keychain / Credential Manager / Secret Service).

            ### المزوّدون المدعومون
            - OpenAI، Anthropic Claude، DeepSeek، GLM، Qwen، Moonshot، وأي واجهة متوافقة مع OpenAI.
